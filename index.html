  :root { --bg:#08111E; --screen:#0F1B2D; --panel:#172A44; --line:#2A4468; --cell:#24405F; --text:#F4F1EA; --muted:#A9B7CC; --dim:#6F82A0; --soft:#C9D3E1; --accent:#F2B84B; --green:#3DBE7A; --red:#E06A5A; --violet:#B79CFF; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Rubik', 'Segoe UI', 'Assistant', 'Arial Hebrew', Arial, sans-serif; }
  body { background: radial-gradient(1200px 600px at 50% -10%, #17304F 0%, var(--bg) 60%) fixed; min-height: 100vh; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .45; }
  .stage { display: flex; gap: 28px; justify-content: center; align-items: flex-start; flex-wrap: wrap; padding: 16px 12px 48px; direction: ltr; }
  .phone { position: relative; width: 390px; max-width: 100%; background: linear-gradient(180deg, #12223A 0%, var(--screen) 140px); border: 1px solid rgba(255,255,255,.05); border-radius: 28px; padding: 18px 14px 22px; display: flex; flex-direction: column; gap: 14px; direction: rtl; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .phone.wide { width: 470px; }
  @media (max-width: 500px) { .stage { padding: 0 0 32px; gap: 12px; } .phone, .phone.wide { width: 100%; border-radius: 0; border: 0; box-shadow: none; padding: 14px 12px 20px; background: transparent; } body { background: var(--screen); } }
  .row { display: flex; align-items: center; gap: 8px; }
  .iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); display: flex; align-items: center; justify-content: center; padding: 0; flex: none; }
  .btn { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 14px; font-weight: 600; padding: 0 12px; transition: transform .06s, background .15s, border-color .15s; }
  .btn:hover:not(:disabled), .iconbtn:hover { border-color: #3A5A84; }
  .btn:active:not(:disabled), .iconbtn:active, .card:active { transform: translateY(1px) scale(.99); }
  .btn.primary { background: var(--accent); color: #0F1B2D; border: 0; box-shadow: 0 3px 0 #A9761E; font-weight: 800; }
  .btn.good { background: var(--green); color: #0B2416; border: 0; font-weight: 800; }
  .btn.danger { color: #FFB4A3; }
  .panel { background: linear-gradient(180deg, #1A2F4C, var(--panel)); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .muted { color: var(--muted); } .dim { color: var(--dim); } .soft { color: var(--soft); }

  .chip { font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); align-items: center; flex-wrap: wrap; }

  .overlay { position: fixed; inset: 0; z-index: 10; background: rgba(5,10,18,0.78); display: flex; align-items: center; justify-content: center; padding: 16px; direction: rtl; }
  .dialog { width: 340px; max-width: 100%; max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid #3A5A84; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .zgrid { direction: ltr; align-self: center; display: grid; grid-template-columns: repeat(7, 36px); gap: 2px; padding: 6px; background: var(--screen); border-radius: 12px; }

  .piece { display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
  .marker-dot { position: absolute; width: 26%; height: 26%; border-radius: 999px; background: rgba(15,27,45,.38); }

  .sqr.dragsrc .piece { opacity: .28; }

  .dragghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%,-58%) scale(1.18); filter: drop-shadow(0 8px 10px rgba(0,0,0,.45)); }

  .shotfx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; overflow: visible; }

  .board8.recoil { animation: recoil 240ms ease-out both; }

  .modetabs button { background: transparent; color: var(--muted); }

  .demo-m { position: absolute; width: 14.2857%; height: 14.2857%; display: flex; align-items: center; justify-content: center; animation: dmIn .3s ease both; }
  .demo-m.dot::after { content: ''; width: 30%; height: 30%; border-radius: 999px; background: rgba(15,27,45,.45); }
  .demo-m.ring::after { content: ''; width: 86%; height: 86%; border-radius: 999px; border: 3px solid rgba(224,72,60,.85); box-sizing: border-box; animation: dmPulse 1s ease-in-out infinite; }

  .demo-shot { position: absolute; inset: 0; width: 100%; height: 100%; }

  .demo-shot circle { fill: rgba(255,90,69,.85); transform-box: fill-box; transform-origin: center; animation: shHit .6s .1s ease-out both; }

  @keyframes dmIn { from { opacity: 0; transform: scale(.5); } }

  .badge { position: absolute; top: -2px; right: -2px; width: 18px; height: 18px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.5); z-index: 2; }
  .movelist { display: grid; grid-template-columns: 30px 1fr 1fr; gap: 2px 6px; font-size: 13px; max-height: 180px; overflow-y: auto; direction: ltr; }

  body.neon .menu-card:hover { border-color: rgba(0,240,255,.6); box-shadow: 0 0 18px rgba(0,240,255,.25), 0 8px 24px rgba(0,0,0,.35); transform: translateY(-1px); }

  const tpl = PIECE_SVG[kind] || '';

    .split('{{size}}').join(String(size))
    .split('{{fill}}').join(black ? '#2B2622' : '#F4F1EA')

    .split('{{rot}}').join(String(rot || 0))
    .split('{{rot2}}').join(String(rot2 === undefined ? 180 : rot2));

  s.style.width = size + 'px'; s.style.height = size + 'px';
  s.innerHTML = svg;
  return s;
}

    const openZoom = (id) => (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ zoom: id }); };

    const used = this.usedOf(slots, pawns);
    const remaining = budget - used;
    const placed = slots.filter((x) => x && x !== 'K').length;

    const TH = this.props.theme || {};
    const light = TH.light || '#E3D2AE', dark = TH.dark || '#9C774C';
    const pawnRow = order.map((f, d) => ({
      bg: (d % 2 === 0) ? light : dark,
      kind: pawns[f],
      aria: 'רגלי ' + files[f] + (pawns[f] === 'OF' ? ' – קצין' : ''),
      zoom: openZoom(pawns[f]),
      toggle: () => {
        if (ready) return;
        const next = pawns.slice();
        if (next[f] === 'OF') next[f] = 'P';
        else if (this.usedOf(slots, next.map((x, j) => j === f ? 'OF' : x)) <= budget) next[f] = 'OF';
        else { this.setState({ info: 'OF' }); return; }
        this.setState({ pawns: next, info: next[f] });
      }
    }));
    const fileLabels = order.map((f) => ({ l: files[f] }));

    const ropeKind = (x) => {
      if (x === 'ROa') return white ? 'ROL' : 'ROR';
      if (x === 'ROb') return white ? 'ROR' : 'ROL';
      return x;
    };

    const slotList = order.map((f, d) => {
      const id = slots[f];
      const isKing = id === 'K';
      const rope = this.isRope(id);
      const p = id && !isKing ? this.byId(rope ? 'RO' : id) : null;
      return {
        kind: id ? ropeKind(id) : 'P',
        size: rope ? 45 : 40,
        filled: !!id,
        empty: !id,
        bg: (d % 2 === 0) ? dark : light,
        ring: (sel === f) ? accent : 'transparent',
        aria: 'משבצת ' + files[f] + (isKing ? ' – מלך (קבוע)' : (p ? ' – ' + p.name : ' – ריקה')),
        zoom: (e) => { if (e && e.preventDefault) e.preventDefault(); if (p) this.setState({ zoom: p.id }); },
        select: () => { if (!isKing && !ready) this.setState({ sel: f, info: null }); }
      };
    });

    const rookLike = { Q:1, R:1, AM:1, CH:1 };
    const castle = (id) => rookLike[id]
      ? { text: 'אפשרית', color: '#7CD38F' }
      : { text: 'לא אפשרית', color: '#FF9C8A' };

    const cellColor = { c:'#F4F1EA', s:'#5FA8FF', l:accent, x:'#FF7A66', e:'#24405F' };
    const selId = sel !== null ? slots[sel] : null;
    const selBase = this.isRope(selId) ? 'RO' : selId;

    const cards = this.pieces
      .filter((p) => p.g !== 'pawn' && (filter === 'all' || p.g === filter))
      .map((p) => {
        const next = this.place(slots, sel, p.id);
        const ok = !!next && this.usedOf(next, pawns) <= budget && this.countOf(next, p.id) <= maxC;
        return {
          id: p.id,
          name: p.name,
          pts: p.pts || 'חינם',
          count: this.countOf(slots, p.id),
          op: ok ? 1 : 0.38,
          border: selBase === p.id ? accent : '#2A4468',
          pillBg: p.g === 'classic' ? accent : (p.g === 'fairy' ? '#B79CFF' : '#7FD8D0'),
          aria: p.name + ', ' + p.pts + ' נקודות' + (ok ? '' : ', לא זמין כרגע'),
          cells: p.grid.map((v) => ({ bg: cellColor[v] })),
          zoom: openZoom(p.id),
          pick: () => {
            if (!ok || ready) { this.setState({ info: p.id }); return; }
            let ns = -1;
            for (const f of order) { if (!next[f]) { ns = f; break; } }
            this.setState({ slots: next, sel: ns === -1 ? sel : ns, info: p.id });
          }
        };
      });

    const tabs = [['all','הכול'],['classic','קלאסי'],['fairy','פיות'],['mine','שלי']].map(([k, label]) => ({
      label,
      bg: filter === k ? accent : 'transparent',
      color: filter === k ? '#0F1B2D' : '#A9B7CC',
      pick: () => this.setState({ filter: k })
    }));

    const emptyCount = slots.filter((x) => !x).length;
    const officers = pawns.filter((x) => x === 'OF').length;
    const status = (remaining < 0 ? 'חרגת מהתקציב ב-' + (-remaining) + ' — הסר כלים כדי להתחיל' : remaining === 0 ? 'ניצלת את כל התקציב' : 'נותרו ' + remaining + ' נקודות · לא חובה לנצל הכול')
      + (emptyCount ? ' · ' + emptyCount + ' משבצות ריקות' : '')
      + (officers ? ' · ' + officers + ' קצינים' : '');

    const selText = sel === null
      ? 'בחר משבצת בשורה האחורית, ואז בחר כלי'
      : 'משבצת ' + files[sel] + ' נבחרה' + (selBase && selBase !== 'K' ? ' (' + this.byId(selBase).name + ') — בחר כלי להחלפה' : ' — בחר כלי למקם');

    const infoId = info || (selBase && selBase !== 'K' ? selBase : null);
    const ip = infoId ? this.byId(infoId) : null;
    const ptsLabel = (p) => p.id === 'OF' ? ofCost + ' נקודות (על כל רגלי שהופך לקצין)' : ((p.id === 'P' || p.pts === 0) ? 'חינם' : p.pts + ' נקודות');
    const infoView = ip
      ? { name: ip.name, ptsText: ptsLabel(ip), desc: ip.desc }
      : { name: 'פרטי כלי', ptsText: '', desc: 'לחץ על כלי כדי לראות איך הוא זז.' };

    const zp = zoom ? this.byId(zoom) : null;
    const zoomView = zp
      ? {
          id: zp.id,
          name: zp.name,
          ptsText: ptsLabel(zp),
          desc: zp.desc,
          specialLabel: zp.specialLabel || 'יכולת מיוחדת',
          cells: zp.grid.map((v, i) => ({ bg: v === 'c' ? '#3A5A84' : cellColor[v], center: i === 24 }))
        }
      : { id: 'P', name: '', ptsText: '', desc: '', specialLabel: '', cells: [] };

    return {
      side, budget, maxC, ofCost, accent, used,
      sideLabel: white ? 'לבן' : 'שחור',
      barPct: Math.min(100, Math.round(used / budget * 100)),
      status,
      pawnRow, slotList, fileLabels, cards, tabs, selText,
      info: infoView,
      zoomOpen: !!zp,
      zoom: zoomView,
      closeZoom: () => this.setState({ zoom: null }),
      stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },
      castleQ: castle(slots[0]),
      castleK: castle(slots[7]),
      isReady: ready,
      readyBg: ready ? '#3DBE7A' : '#172A44',
      readyInk: ready ? '#0B2416' : '#7CD38F',
      readyShadow: ready ? 0 : 4,
      readyY: ready ? 4 : 0,
      readyText: ready ? 'מוכן! ממתין ליריב' : 'מוכן למשחק',
      readyHint: ready ? 'הדק נעול. לחיצה נוספת תבטל את המוכנות ותאפשר לערוך.' : 'כששני הצדדים מוכנים, המשחק מתחיל.',
      toggleReady: () => {
        const r = !ready;
        if (r && this.usedOf(slots, pawns) > budget) { this.setState({ info: null }); return; }
        this.setState({ ready: r });
        if (this.props.onReady) this.props.onReady(side, r ? slots.concat(pawns) : null);
      },
      removeSel: () => {
        if (sel === null || ready) return;
        const next = slots.slice(); this.clearAt(next, sel);
        this.setState({ slots: next });
      },
      classic: () => { if (!ready) this.setState({ slots: ['R','N','B','Q','K','B','N','R'], pawns: ['P','P','P','P','P','P','P','P'], sel: 3, info: null }); },
      clearAll: () => { if (!ready) this.setState({ slots: [null,null,null,null,'K',null,null,null], pawns: ['P','P','P','P','P','P','P','P'], sel: white ? 0 : 7, info: null }); }
    };
  }
}

class GameC extends DCLogic {
  constructor(props) {
    super(props);
    this.E = this.makeEngine();
    this.state = this.freshState();
  }

  decks() {
    const C = ['R','N','B','Q','K','B','N','R'];
    return { w: this.props.whiteDeck || C, b: this.props.blackDeck || C };
  }

  freshState() {
    const d = this.decks();
    const human = this.props.myColor;
    return {
      st: this.E.setup(d.w, d.b), sel: null, moves: [], history: [], log: [], record: [], last: null,
      flipped: human === 'b', infoT: null, events: [], result: null, pendingPromo: null,
      drawOffer: null, notice: '', thinking: false, ended: false, premove: null, preSel: null, preMoves: [],
      clock: this.props.clock ? { w: this.props.clock.base, b: this.props.clock.base, inc: this.props.clock.inc || 0, running: null, last: 0 } : null
    };
  }

  makeEngine() {
  const O = [[1,0],[-1,0],[0,1],[0,-1]];
  const D = [[1,1],[1,-1],[-1,1],[-1,-1]];
  const sym8 = (a, b) => {
    const out = [], seen = {};
    [[a,b],[b,a]].forEach(([x,y]) => [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([sx,sy]) => {
      const k = (x*sx) + ',' + (y*sy);
      if (!seen[k]) { seen[k] = 1; out.push([x*sx, y*sy]); }
    }));
    return out;
  };
  const N = sym8(1,2);
  const DAB = sym8(2,0);
  const SPEC = {
    Q:{slide:O.concat(D)}, R:{slide:O}, B:{slide:D}, N:{leap:N},
    AM:{slide:O.concat(D), leap:N}, CH:{slide:O, leap:N}, AR:{slide:D, leap:N},
    CE:{leap:O.concat(D, N)}, NR:{slide:N}, MA:{leap:O.concat(D)},
    CA:{leap:sym8(1,3)}, ZE:{leap:sym8(2,3)}, WA:{leap:O}, FE:{leap:D},
    AL:{leap:sym8(2,2)}, DA:{leap:DAB},
    MB:{slide:D, range:2}, MR:{slide:O, range:2},
    K:{leap:O.concat(D)}, GR:{leap:O.concat(D)}
  };
  const ROOKLIKE = { Q:1, R:1, AM:1, CH:1 };
  const PROMO = ['Q','R','B','N'];
  const PROMO_OF = ['Q','R','B','N','AM','CH','AR','CE','NR','MA','CA','ZE','WA','FE','AL','DA','MN','MB','MR','GU','GR'];
  const GR_START = 2, GR_MAX = 6;
  const hearts = (p) => Math.floor((p.hp || 0) / 2);
  const isRope = (p) => !!p && (p.t === 'RO' || p.t === 'ROE');
  const on = (f, r) => f >= 0 && f < 8 && r >= 0 && r < 8;
  const sq = (f, r) => r * 8 + f;
  const opp = (c) => c === 'w' ? 'b' : 'w';

  const mnPathFree = (board, f, r, dx, dy) => {
    if (Math.abs(dy) === 2) { const sy = Math.sign(dy); return !board[sq(f, r + sy)] && !board[sq(f, r + 2*sy)]; }
    const sx = Math.sign(dx); return !board[sq(f + sx, r)] && !board[sq(f + 2*sx, r)];
  };

  const attacks = (board, s) => {
    const p = board[s]; const f = s % 8, r = (s - f) / 8; const out = [];
    if (!p || isRope(p)) return out;
    if (p.t === 'P') {
      const dr = p.c === 'w' ? 1 : -1;
      [-1, 1].forEach((df) => { if (on(f + df, r + dr)) out.push(sq(f + df, r + dr)); });
      return out;
    }
    if (p.t === 'GU') {
      O.forEach(([dx,dy]) => { let x = f + dx, y = r + dy; while (on(x, y)) { out.push(sq(x, y)); if (board[sq(x, y)]) break; x += dx; y += dy; } });
      return out;
    }
    if (p.t === 'OF') {
      const dr = p.c === 'w' ? 1 : -1;
      [[0,dr],[1,0],[-1,0],[1,dr],[-1,dr]].forEach(([dx,dy]) => { if (on(f + dx, r + dy)) out.push(sq(f + dx, r + dy)); });
      return out;
    }
    if (p.t === 'MN') {
      N.forEach(([dx,dy]) => { if (on(f + dx, r + dy) && mnPathFree(board, f, r, dx, dy)) out.push(sq(f + dx, r + dy)); });
      return out;
    }
    const spec = SPEC[p.t]; if (!spec) return out;
    (spec.leap || []).forEach(([dx,dy]) => { if (on(f + dx, r + dy)) out.push(sq(f + dx, r + dy)); });
    (spec.slide || []).forEach(([dx,dy]) => {
      const lim = spec.range || 99; let x = f + dx, y = r + dy, k = 1;
      while (on(x, y) && k <= lim) { out.push(sq(x, y)); if (board[sq(x, y)]) break; x += dx; y += dy; k++; }
    });
    return out;
  };

  const isAttacked = (board, s, by) => {
    for (let i = 0; i < 64; i++) { const p = board[i]; if (p && p.c === by && attacks(board, i).indexOf(s) !== -1) return true; }
    return false;
  };
  const kingSq = (board, c) => { for (let i = 0; i < 64; i++) { const p = board[i]; if (p && p.t === 'K' && p.c === c) return i; } return -1; };

  const pseudo = (board, s, ep) => {
    const p = board[s]; const f = s % 8, r = (s - f) / 8; const mv = [];
    const capOk = (t) => !!t && t.c !== p.c && t.t !== 'ROE';
    const add = (to, type, extra) => mv.push(Object.assign({ from: s, to, type }, extra || {}));
    if (p.t === 'RO') return mv;
    if (p.t === 'ROE') {
      let m = -1; for (let i = 0; i < 64; i++) { const q = board[i]; if (q && q.t === 'RO' && q.rid === p.rid) { m = i; break; } }
      if (m < 0) return mv;
      const mf = m % 8, mr = (m - mf) / 8;
      O.concat(D).forEach(([dx,dy]) => { const x = mf + dx, y = mr + dy; if (on(x, y) && !board[sq(x, y)]) add(sq(x, y), 'rope'); });
      return mv;
    }
    if (p.t === 'P') {
      const dr = p.c === 'w' ? 1 : -1, last = p.c === 'w' ? 7 : 0, start = p.c === 'w' ? 1 : 6;
      if (on(f, r + dr) && !board[sq(f, r + dr)]) {
        add(sq(f, r + dr), 'move', { promo: r + dr === last });
        if (r === start && on(f, r + 2*dr) && !board[sq(f, r + 2*dr)]) add(sq(f, r + 2*dr), 'move');
      }
      [-1, 1].forEach((df) => { if (on(f + df, r + dr) && capOk(board[sq(f + df, r + dr)])) add(sq(f + df, r + dr), 'cap', { promo: r + dr === last }); });
      [-1, 1].forEach((df) => {
        const to = sq(f + df, r + dr);
        if (on(f + df, r + dr) && ep === to && !board[to]) {
          const v = board[sq(f + df, r)];
          if (v && v.t === 'P' && v.c !== p.c) add(to, 'ep', { victim: sq(f + df, r) });
        }
      });
      return mv;
    }
    if (p.t === 'GR' && (p.hp || 0) < GR_MAX) add(s, 'charge');
    if (p.t === 'GU') {
      DAB.forEach(([dx,dy]) => { if (on(f + dx, r + dy) && !board[sq(f + dx, r + dy)]) add(sq(f + dx, r + dy), 'move'); });
      O.forEach(([dx,dy]) => { let x = f + dx, y = r + dy; while (on(x, y)) { const t = board[sq(x, y)]; if (t) { if (capOk(t)) add(sq(x, y), 'shoot'); break; } x += dx; y += dy; } });
      return mv;
    }
    const last = p.c === 'w' ? 7 : 0;
    attacks(board, s).forEach((to) => {
      const t = board[to]; const promo = p.t === 'OF' && Math.floor(to / 8) === last;
      if (!t) add(to, 'move', promo ? { promo: true } : null); else if (capOk(t)) add(to, 'cap', promo ? { promo: true } : null);
    });
    return mv;
  };

  const castleMoves = (board, s, c) => {
    const p = board[s]; const r = c === 'w' ? 0 : 7; const res = [];
    if (!p || p.t !== 'K' || p.m || s !== sq(4, r)) return res;
    const o = opp(c);
    if (isAttacked(board, s, o)) return res;
    const ck = board[sq(7, r)];
    if (ck && ck.c === c && !ck.m && ROOKLIKE[ck.t] && !board[sq(5, r)] && !board[sq(6, r)] && !isAttacked(board, sq(5, r), o) && !isAttacked(board, sq(6, r), o))
      res.push({ from: s, to: sq(6, r), type: 'castle', rf: sq(7, r), rt: sq(5, r) });
    const cq = board[sq(0, r)];
    if (cq && cq.c === c && !cq.m && ROOKLIKE[cq.t] && !board[sq(1, r)] && !board[sq(2, r)] && !board[sq(3, r)] && !isAttacked(board, sq(3, r), o) && !isAttacked(board, sq(2, r), o))
      res.push({ from: s, to: sq(2, r), type: 'castle', rf: sq(0, r), rt: sq(3, r) });
    return res;
  };

  const keyOf = (board, turn, ep) => {
    let k = turn + (ep === null || ep === undefined ? '-' : ep);
    for (let i = 0; i < 64; i++) {
      const p = board[i];
      if (!p) { k += '.'; continue; }
      k += p.c + p.t + (p.t === 'GR' ? p.hp : '') + ((p.t === 'K' || ROOKLIKE[p.t]) && !p.m ? '*' : '') + (p.rid ? p.rid : '') + ',';
    }
    return k;
  };

  const apply = (state, mv) => {
    const board = state.board.slice();
    const cap = { w: state.captured.w.slice(), b: state.captured.b.slice() };
    const p = board[mv.from]; const c = p.c; const events = [];
    let capture = false;
    const moved = (q, extra) => Object.assign({}, q, { m: true }, extra || {});
    const dropRope = (t) => {
      if (t.t !== 'RO') return;
      for (let i = 0; i < 64; i++) { const q = board[i]; if (q && q.t === 'ROE' && q.rid === t.rid) board[i] = null; }
      events.push('rope');
    };
    if (mv.type === 'charge') {
      board[mv.from] = moved(p, { hp: Math.min(GR_MAX, (p.hp || 0) + 1) }); events.push('charge');
    } else if (mv.type === 'move' || mv.type === 'rope') {
      board[mv.to] = moved(p); board[mv.from] = null;
    } else if (mv.type === 'ep') {
      board[mv.to] = moved(p); board[mv.from] = null;
      cap[c].push('P'); board[mv.victim] = null; events.push('ep'); capture = true;
    } else if (mv.type === 'cap') {
      const t = board[mv.to]; capture = true;
      if (t.t === 'GR' && hearts(t) >= 2) {
        board[mv.to] = Object.assign({}, t, { hp: t.hp - 2 }); board[mv.from] = null; cap[t.c].push(p.t); events.push('shield');
      } else {
        cap[c].push(t.t); dropRope(t); board[mv.to] = moved(p); board[mv.from] = null;
      }
    } else if (mv.type === 'shoot') {
      const t = board[mv.to]; capture = true;
      if (t.t === 'GR' && hearts(t) >= 2) { board[mv.to] = Object.assign({}, t, { hp: t.hp - 2 }); events.push('shield'); }
      else { cap[c].push(t.t); dropRope(t); board[mv.to] = null; }
    } else if (mv.type === 'castle') {
      board[mv.to] = moved(p); board[mv.from] = null;
      board[mv.rt] = moved(board[mv.rf]); board[mv.rf] = null;
    }
    const lastRank = c === 'w' ? 7 : 0;
    const landed = board[mv.to];
    if (landed && landed.c === c && (landed.t === 'P' || landed.t === 'OF') && Math.floor(mv.to / 8) === lastRank) {
      const allowed = landed.t === 'OF' ? PROMO_OF : PROMO;
      const to = allowed.indexOf(mv.promoTo) !== -1 ? mv.promoTo : (landed.t === 'OF' ? 'AM' : 'Q');
      board[mv.to] = Object.assign({}, landed, { t: to, hp: to === 'GR' ? GR_START : 0 }); events.push('promo');
    }
    for (let g = 0; g < 64; g++) {
      const G = board[g]; if (!G || G.t !== 'GR' || G.c !== c) continue;
      const gf = g % 8, gr = (g - gf) / 8; const near = [], far = [];
      for (let i = 0; i < 64; i++) {
        const q = board[i]; if (!q || q.c === c || q.t === 'K' || isRope(q)) continue;
        const qf = i % 8, qr = (i - qf) / 8; const d = Math.max(Math.abs(qf - gf), Math.abs(qr - gr));
        if (d === 1) near.push(i); else if (d === 2) far.push(i);
      }
      if (hearts(board[g]) >= 2 && near.length) {
        const i = near[0]; cap[c].push(board[i].t); board[i] = null;
        board[g] = Object.assign({}, board[g], { hp: board[g].hp - 2 }); events.push('eat'); capture = true;
      }
      far.forEach((i) => {
        const qf = i % 8, qr = (i - qf) / 8;
        const to = sq(qf + Math.sign(gf - qf), qr + Math.sign(gr - qr));
        if (!board[to]) { board[to] = board[i]; board[i] = null; events.push('pull'); }
      });
    }
    const newEp = (p.t === 'P' && Math.abs(mv.to - mv.from) === 16) ? (mv.to + mv.from) / 2 : null;
    const pawnish = p.t === 'P' || p.t === 'OF';
    const half = (capture || pawnish) ? 0 : (state.half || 0) + 1;
    const turn = opp(state.turn);
    const key = keyOf(board, turn, newEp);
    return { board, turn, captured: cap, events, ep: newEp, half, ply: (state.ply || 0) + 1, hist: { key, prev: state.hist || null }, capture };
  };

  const kingSafeAfter = (state, m, c) => {
    const n = apply(state, m); const k = kingSq(n.board, c);
    return k >= 0 && !isAttacked(n.board, k, opp(c));
  };
  const legal = (state, s) => {
    const p = state.board[s]; if (!p || p.c !== state.turn) return [];
    const mv = pseudo(state.board, s, state.ep).concat(castleMoves(state.board, s, p.c));
    return mv.filter((m) => kingSafeAfter(state, m, p.c));
  };
  const allLegal = (state) => {
    let res = [];
    for (let i = 0; i < 64; i++) { const p = state.board[i]; if (p && p.c === state.turn) res = res.concat(legal(state, i)); }
    return res;

/* ----- Complichess engine in a background worker ----- */
const AIW = { w: null, id: 0, cbs: {} };
function aiWorker() {
  if (AIW.w) return AIW.w;
  try {
    const src = makeEngine.toString() + '\n' + makeSearcher.toString() + '\n' +
      'const E = makeEngine(), S = makeSearcher(E);\n' +
      'onmessage = (e) => { const d = e.data; let r = null; try { if (d.cmd === "move") r = S.chooseMove(d.st, d.level); else if (d.cmd === "scores") r = S.rootScores(d.st, { depth: d.depth, ms: d.ms, minDepth: d.minDepth || 0 }); else if (d.cmd === "think") r = S.think(d.st, { depth: d.depth, ms: d.ms }); } catch (err) { r = { error: String(err && err.message || err) }; } postMessage({ id: d.id, r }); };';
    const w = new Worker(URL.createObjectURL(new Blob([src], { type: 'application/javascript' })));
    w.onmessage = (e) => { const cb = AIW.cbs[e.data.id]; delete AIW.cbs[e.data.id]; if (cb) cb(e.data.r); };
    w.onerror = () => { AIW.w = 'main'; };
    AIW.w = w;
  } catch (e) { AIW.w = 'main'; }
  return AIW.w;
}
let MAIN_S = null;
function aiCall(msg) {
  return new Promise((res) => {
    const w = aiWorker();
    if (w === 'main') {
      setTimeout(() => {
        const E = makeEngine(); MAIN_S = MAIN_S || makeSearcher(E);
        let r = null;
        try { if (msg.cmd === 'move') r = MAIN_S.chooseMove(msg.st, msg.level); else if (msg.cmd === 'scores') r = MAIN_S.rootScores(msg.st, { depth: msg.depth, ms: msg.ms, minDepth: msg.minDepth || 0 }); else r = MAIN_S.think(msg.st, { depth: msg.depth, ms: msg.ms }); } catch (e) { r = null; }
        res(r);
      }, 20);
      return;
    }
    const id = ++AIW.id; AIW.cbs[id] = res; w.postMessage(Object.assign({ id }, msg));
  });
}
function stopAI() {
  if (AIW.w && AIW.w !== 'main') { try { AIW.w.terminate(); } catch (e) {} }
  Object.values(AIW.cbs).forEach((cb) => cb(null)); AIW.w = null; AIW.cbs = {};
}

function randomDeck(budget) {
  const pieces = new BuilderC({}).pieces.filter((p) => p.g !== 'pawn' && p.id !== 'RO');
  const deck = [null, null, null, null, 'K', null, null, null]; let left = budget || 35; const count = {};
  const slots = [0, 1, 2, 3, 5, 6, 7].sort(() => Math.random() - 0.5);
  for (const s of slots) {
    const options = pieces.filter((p) => p.pts <= left && (count[p.id] || 0) < 2 && p.pts > 0);
    if (!options.length) break;
    const p = options[Math.floor(Math.random() * options.length)];
    deck[s] = p.id; left -= p.pts; count[p.id] = (count[p.id] || 0) + 1;
  }
  const pawns = ['P','P','P','P','P','P','P','P'];
  for (let i = 0; i < 8 && left > 0; i++) if (Math.random() < 0.15) { pawns[i] = 'OF'; left -= 1; }
  return deck.concat(pawns);
}
const CLASSIC16 = ['R','N','B','Q','K','B','N','R','P','P','P','P','P','P','P','P'];

function startAIGame() {
  AI.lastDeck = AI.lastDeck || pget('lastDeck', null);
  AI.human = AIS.color === 'r' ? (Math.random() < 0.5 ? 'w' : 'b') : AIS.color;
  AI.builder = new BuilderC({
    side: AI.human === 'w' ? 'white' : 'black', initial: AI.lastDeck, theme: theme(),
    onReady: (side, deck) => { if (!deck) return; AI.deck = deck; AI.lastDeck = deck; pset('lastDeck', deck); launchAIGame(); }
  });
  go('ai-build');
}
function launchAIGame() {
  AI.oppDeck = AIS.oppDeck === 'classic' ? CLASSIC16.slice() : (AIS.oppDeck === 'mirror' ? AI.deck.slice() : randomDeck(budgetNow()));
  const white = AI.human === 'w' ? AI.deck : AI.oppDeck, black = AI.human === 'w' ? AI.oppDeck : AI.deck;
  AI.lastDelta = null; AI.hint = null;
  AI.label = 'מחשב · רמה ' + AIS.cxLevel;
  AI.oppElo = CX_ELO[AIS.cxLevel];
  const aiColor = AI.human === 'w' ? 'b' : 'w';
  AI.game = new GameC({
    whiteDeck: white, blackDeck: black, myColor: AI.human, aiColor, aiLabel: 'מחשב', theme: theme(), onSound: playSound, deferStart: true,
    requestAI: (st, cb) => {
      const t0 = Date.now();
      const deliver = (mv) => setTimeout(() => { cb(mv); scheduleRender(); }, Math.max(0, 350 - (Date.now() - t0)));
      aiCall({ cmd: 'move', st, level: AIS.cxLevel }).then((m) => deliver(m && !m.error ? { from: m.from, to: m.to, type: m.type, promoTo: null } : null));
    },
    onDrawOffer: () => {
      const g = AI.game; const st = g.state.st;
      aiCall({ cmd: 'think', st, ms: 400 }).then((r) => {
        if (!r) { g.drawDeclined(); return; }
        const aiScore = st.turn === aiColor ? r.score : -r.score;
        if (aiScore <= 30 && st.ply >= 20) g.finish({ reason: 'agreed', winner: null }); else g.drawDeclined();
        scheduleRender();
      });
    },
    onEnd: (rec) => { AI.lastDelta = recordResult(Object.assign({}, rec, { aiLabel: AI.label, oppElo: AI.oppElo }), 'ai', AI.oppElo); },
    onReview: (rec) => openReview(Object.assign({}, rec, { aiLabel: AI.label })),
    onRestart: () => { showAd(() => { if (AI.game) AI.game.startIfAI(); }); },
    onExit: () => { stopAI(); AI.game = null; go('ai-setup'); }
  });
  go('ai-game');
  showAd(() => { if (AI.game) AI.game.startIfAI(); });
}

const AD = { on: false, t0: 0, cb: null };
function showAd(cb) {
  if (AD_SRC.length < 200) { if (cb) cb(); return; }
  AD.on = true; AD.t0 = Date.now(); AD.cb = cb || null; scheduleRender();
}
function closeAd() { if (!AD.on) return; AD.on = false; const cb = AD.cb; AD.cb = null; scheduleRender(); if (cb) setTimeout(cb, 30); }
function adOverlay() {
  const el = Math.min(5, (Date.now() - AD.t0) / 1000), left = Math.max(0, Math.ceil(5 - el)), canSkip = el >= 2;
  const C = 2 * Math.PI * 22, off = C * (el / 5);
  const ring = document.createElement('div'); ring.className = 'ring';
  ring.innerHTML = '<svg viewBox="0 0 54 54" width="54" height="54"><circle cx="27" cy="27" r="22" fill="rgba(0,0,0,.55)" stroke="rgba(255,255,255,.25)" stroke-width="4"/><circle id="adArc" cx="27" cy="27" r="22" fill="none" stroke="#F2B84B" stroke-width="4" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 27 27)"/><text id="adNum" x="27" y="33" text-anchor="middle" font-size="18" font-weight="800" fill="#fff" font-family="Rubik, Arial">' + left + '</text></svg>';
  return h('div', { class: 'ad', role: 'dialog', 'aria-label': 'פרסומת' }, [
    h('img', { src: AD_SRC, alt: 'פרסומת: תנו לבר לבובסקי פטור נעליים' }), ring,
    h('span', { class: 'tag', text: 'פרסומת' }),
    h('button', { class: 'skip', id: 'adSkip', disabled: !canSkip, onclick: () => { if (Date.now() - AD.t0 >= 2000) closeAd(); }, text: canSkip ? 'דלג ›' : 'דלג בעוד ' + Math.max(1, Math.ceil(2 - el)) })
  ]);
}

/* ---------- game view ---------- */
const CONFIRM = { what: null, at: 0 };
function confirmBtn(key, label, sure, action, cls) {
  const armed = CONFIRM.what === key && Date.now() - CONFIRM.at < 4000;
  return h('button', { class: 'btn ' + (cls || ''), style: 'flex:1', onclick: () => { if (armed) { CONFIRM.what = null; action(); } else { CONFIRM.what = key; CONFIRM.at = Date.now(); scheduleRender(); setTimeout(scheduleRender, 4100); } }, text: armed ? sure : label });
}
function guardedExit(g, opts) {
  if (opts.spectator || g.over || !g.record.length) return g.exit;
  return () => {
    if (CONFIRM.what === 'exit' && Date.now() - CONFIRM.at < 3000) { CONFIRM.what = null; APP.toast = ''; g.exit(); return; }

const EXTRA_VIEWS_HAS = (k) => typeof EXTRA_VIEWS !== 'undefined' && !!EXTRA_VIEWS[k];
/* ---------- ticker: clocks + ad countdown ---------- */
function activeGame() { return APP.mode === 'local' ? game : APP.mode === 'ai-game' ? (typeof AI !== 'undefined' ? AI.game : null) : APP.mode === 'online' ? ON.game : null; }
setInterval(() => {
  if (AD.on) {
    const el = (Date.now() - AD.t0) / 1000;

    const num = document.getElementById('adNum'), arc = document.getElementById('adArc'), sk = document.getElementById('adSkip');
    if (num) num.textContent = String(Math.max(1, Math.ceil(5 - el)));
    if (arc) arc.setAttribute('stroke-dashoffset', (2 * Math.PI * 22 * el / 5).toFixed(1));
    if (sk) { const can = el >= 2; sk.disabled = !can; sk.textContent = can ? 'דלג ›' : 'דלג בעוד ' + Math.max(1, Math.ceil(2 - el)); }
    return;
  }
  const g = activeGame();
  if (!g || !g.state.clock || !g.state.clock.running || g.state.result) return;
  if (g.tickClock(Date.now())) { scheduleRender(); return; }

  document.querySelectorAll('[data-clock]').forEach((el) => {
    const c = el.getAttribute('data-clock'); const ms = g.clockLeft(c);

    el.textContent = ms < 20000 ? mm + ':' + ss.toFixed(1).padStart(4, '0') : mm + ':' + String(Math.floor(ss)).padStart(2, '0');
    el.classList.toggle('low', ms < 20000);
