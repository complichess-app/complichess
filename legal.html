<p>ברוכים הבאים ל־Complichess ("המשחק"), משחק שחמט שבו כל שחקן בונה את השורה האחורית שלו מדק של כלים. המשחק זמין בכתובת barusik.com/complichess ובאפליקציה שמותקנת ממנה. המשחק מופעל על ידי בר לבובסקי (Barusik Platforms), שפרטי העסק שלו מופיעים בסעיף "פרטי העסק" ("אנחנו", "המפעיל"). השימוש במשחק, וכל רכישה בו, כפופים לתקנון הזה. אם אינכם מסכימים לו — אל תשתמשו במשחק.</p>

<p>המשחק ניתן כמו שהוא ("AS IS"). אנחנו עושים מאמץ שהוא יעבוד היטב ובלי הפסקות, אבל לא מתחייבים לכך, ולא נהיה אחראים לנזק עקיף שנגרם מהשימוש בו. בכל מקרה האחריות שלנו מוגבלת לסכום ששילמתם בפועל ב־12 החודשים האחרונים. אין בסעיף הזה כדי לגרוע מזכות שהחוק מקנה לצרכן.</p>
<h3>8. דין ושיפוט</h3>
<p>על התקנון חלים דיני מדינת ישראל, והסמכות הייחודית נתונה לבתי המשפט המוסמכים בישראל. הנוסח בעברית הוא הנוסח המחייב.</p>
<h3>9. יצירת קשר</h3>
<p>לכל שאלה, בקשה או תלונה: <a href="mailto:complichess.app@gmail.com">complichess.app@gmail.com</a>. פרטי העסק המלאים — בסעיף "פרטי העסק".</p>`,

<p>We want everyone to be able to play Complichess, including people with disabilities and people with visual impairments. The game was built to follow WCAG 2.0 level AA and Israeli Standard 5568, as far as an interactive board game allows.</p>
